name: Design checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make generate test
      - run: git diff --exit-code -- assets/layout.json assets/layout.svg firmware/boards
      - name: Verify committed artifact checksums
        run: sha256sum --check assets/SHA256SUMS
  geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make cad
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-cad
          path: |
            cad/exports/
            cad/validation.json
          if-no-files-found: error
