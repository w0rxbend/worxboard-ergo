name: KiCad boards
on:
  push:
    paths: ["pcb/**", "layout/**", "tools/pcb.sh", "tools/check_pcb_reports.py", ".github/workflows/pcb.yml"]
  pull_request:
    paths: ["pcb/**", "layout/**", "tools/pcb.sh", "tools/check_pcb_reports.py", ".github/workflows/pcb.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make pcb
      - name: Gate ERC, DRC, connectivity and schematic parity
        run: python3 tools/check_pcb_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: routed-kicad-boards-and-reports
          path: |
            pcb/mx/
            pcb/choc/
            pcb/reports/
          if-no-files-found: error
  fabrication:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: A0 is intentionally not manufacturing approved
        run: make check-fabrication
