name: ZMK firmware
on:
  push:
    paths: ["firmware/**", "zephyr/**", "tools/firmware.sh", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "zephyr/**", "tools/firmware.sh", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned ZMK RP2040 firmware
        run: make firmware
      - uses: actions/upload-artifact@v4
        with:
          name: worxboard-ergo-firmware
          path: firmware/artifacts/*.uf2
          if-no-files-found: error
